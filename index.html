<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://kit.fontawesome.com/8125016427.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="Estilos/main.css">
    <script src="JS/script.js" defer></script>
    <title>To do list</title>
</head>
<body>

    <main>
        <h1>Lista to do avançada.</h1>

        <hr>

            <form id="campTudoInput">
                <div id="criarListaCamp">
                    <h2>Criar uma lista:</h2>
                    <p>
                        <input type="text" name="criar" id="icriar" placeholder="Escreva a tarefa">
                        <button type="submit"><i class="fa-solid fa-plus icone"></i></button>
                    </p>
                </div>


                <div id="editarListaCamp" class="esconder">
                    <h2>Edite sua lista aqui:</h2>
                    <p>
                        <input type="text" name="editar" id="ieditar" placeholder="Escreva a tarefa">
                        <button type="submit"><i class="fa-solid fa-check-double icone"></i></button>
                    </p>
                </div>

                <button id="cancelarButton" class="esconder">Cancelar</button>

                <hr class="hrMeioListas">

                <div id="camposPesFiltr">
                    <div id="campPesquisar">
                        <h2>Pesquisar na lista:</h2>
                        <p id="pesquisarP">
                            <input type="text" name="pesquisa" id="ipesquisa" placeholder="Pesquise o nome aqui">
                            <button id="deleteButton"><i class="fa-solid fa-eraser icone"></i></button>
                        </p>
                    </div>
                    <div id="campFiltro">
                        <h2>Filtrar:</h2>
                        <select name="filtro" id="iFiltro">
                            <option value="TDs" selected>Todos</option>
                    
                            <option value="Feitos">Feitos</option>
                            <option value="PFazer">Para fazer</option>
                        </select>
                    </div>
                </div>


            </form>

            <div id="campoTarefas">
                    <div class="tarefa tarefaCompleta">
                        <p class="Completo">Fazer receita de bolo caseira</p>
                         <div class="iconesCampo">
                            <button class="btnConcluir">
                                <i class="fa-solid fa-square-check tarefaIcon concluida"></i>
                            </button>
                            <button class="btnEditar">
                                <i class="fa-solid fa-square-pen tarefaIcon penIcon"></i>
                            </button>
                            <button class="btnExcluir">
                                <i class="fa-solid fa-square-xmark deleteIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="tarefa">
                        <p>Fazer receita de bolo caseira</p>
                        <div class="iconesCampo">
                            <button class="btnConcluir">
                                <i class="fa-solid fa-square-check tarefaIcon concluida"></i>
                            </button>
                            <button class="btnEditar">
                                <i class="fa-solid fa-square-pen tarefaIcon penIcon"></i>
                            </button>
                            <button class="btnExcluir">
                                <i class="fa-solid fa-square-xmark deleteIcon"></i>
                            </button>
                        </div>
                    </div>
                </div>
    </main>
    
</body>
</html>
